<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QRM Debugger</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <header class="brand">
          <div>
            <h1>QRM Debugger</h1>
            <p>CPU dynamic policy trace</p>
          </div>
          <button id="runButton" class="primary-button" type="button">Run</button>
        </header>

        <section class="panel">
          <h2>Topology</h2>
          <div class="grid-3">
            <label>
              CPUs
              <input id="topologyCPUs" type="number" min="1" step="1" />
            </label>
            <label>
              Sockets
              <input id="topologySockets" type="number" min="1" step="1" />
            </label>
            <label>
              NUMAs
              <input id="topologyNUMAs" type="number" min="1" step="1" />
            </label>
          </div>
          <div class="grid-2">
            <label>
              Reserved CPUs
              <input id="reservedCPUs" type="number" min="0" step="1" />
            </label>
            <label>
              Reclaim reserve size
              <input id="reservedReclaimedCPUsSize" type="number" min="0" step="1" />
            </label>
          </div>
          <div class="grid-2">
            <label>
              Hint selection
              <select id="hintSelection">
                <option value="first-preferred">first-preferred</option>
                <option value="first">first</option>
                <option value="none">none</option>
              </select>
            </label>
          </div>
          <div class="toggles">
            <label><input id="initReservePool" type="checkbox" /> reserve pool</label>
            <label><input id="initReclaimPool" type="checkbox" /> reclaim pool</label>
            <label><input id="enableReclaim" type="checkbox" /> enable reclaim</label>
            <label><input id="enableReclaimNUMABinding" type="checkbox" /> reclaim NUMA binding</label>
            <label><input id="allowSharedCoresOverlapReclaimedCores" type="checkbox" /> overlap reclaim</label>
          </div>
          <label>
            SNB threshold ratio
            <input id="snbCPUThresholdRatio" type="number" min="0" max="1" step="0.01" />
          </label>
        </section>

        <section class="panel">
          <h2>Add Request</h2>
          <div class="grid-2">
            <label>
              QoS
              <select id="requestQoS">
                <option value="shared_cores">shared_cores</option>
                <option value="dedicated_cores">dedicated_cores</option>
                <option value="reclaimed_cores">reclaimed_cores</option>
                <option value="system_cores">system_cores</option>
              </select>
            </label>
            <label>
              CPU
              <input id="requestCPU" type="number" min="0" step="0.1" value="2" />
            </label>
          </div>
          <div class="grid-2">
            <label>
              Pod
              <input id="requestPodName" type="text" value="pod-1" />
            </label>
            <label>
              Container
              <input id="requestContainerName" type="text" value="main" />
            </label>
          </div>
          <div class="grid-2">
            <label>
              Container type
              <select id="requestContainerType">
                <option value="main">main</option>
                <option value="sidecar">sidecar</option>
                <option value="init">init</option>
              </select>
            </label>
            <label>
              Hint nodes
              <input id="requestHintNodes" type="text" placeholder="2 or 0,1" />
            </label>
          </div>
          <div class="toggles">
            <label><input id="requestNUMABinding" type="checkbox" /> NUMA binding</label>
            <label><input id="requestSkipAllocate" type="checkbox" /> skip allocate</label>
          </div>
          <div class="button-row">
            <button id="addRequestButton" type="button">+ Add request</button>
            <button id="resetScenarioButton" type="button">Reset</button>
          </div>
        </section>

        <section class="panel raw-editor">
          <div class="panel-heading">
            <h2>Scenario JSON</h2>
            <button id="formatScenarioButton" type="button">Format</button>
          </div>
          <textarea id="scenarioEditor" spellcheck="false"></textarea>
        </section>
      </aside>

      <main class="workspace">
        <section class="summary-strip" id="summaryStrip"></section>

        <section class="trace-layout">
          <div class="trace-list">
            <div class="section-heading">
              <h2>Flow</h2>
              <span id="stepCount"></span>
            </div>
            <div id="flowList" class="flow-list"></div>
          </div>

          <div class="detail-pane">
            <div id="emptyState" class="empty-state">
              <h2>No trace yet</h2>
              <p>Run the current scenario.</p>
            </div>
            <div id="stepDetail" class="step-detail hidden">
              <div class="detail-head">
                <div>
                  <div id="detailTitle" class="detail-title"></div>
                  <div id="detailMeta" class="detail-meta"></div>
                </div>
                <div id="detailStatus" class="status-pill"></div>
              </div>
              <div class="tabs">
                <button class="tab active" data-tab="overview" type="button">Overview</button>
                <button class="tab" data-tab="hints" type="button">Hints</button>
                <button class="tab" data-tab="allocation" type="button">Allocation</button>
                <button class="tab" data-tab="cache" type="button">Cache</button>
                <button class="tab" data-tab="diff" type="button">Diff</button>
                <button class="tab" data-tab="raw" type="button">Raw</button>
              </div>
              <div id="tabContent" class="tab-content"></div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
